<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
<title>❤️ Love</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#000}
canvas{display:block;cursor:pointer;position:fixed;top:0;left:0}
#hint{position:fixed;bottom:40px;left:0;right:0;text-align:center;
  color:rgba(255,255,255,.4);font:14px sans-serif;pointer-events:none;z-index:10}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hint">点击画面进入全屏 ｜ Esc 退出</div>
<script>
// ══════════════════════════════════════════════════════════════════
// Init
// ══════════════════════════════════════════════════════════════════
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const hint = document.getElementById('hint');

let W = window.innerWidth, H = window.innerHeight;
let CX = W / 2, CY = H / 2;
const BASE_SCALE = H / 1080;

function resize() {
    W = window.innerWidth; H = window.innerHeight;
    CX = W / 2; CY = H / 2;
    canvas.width = W; canvas.height = H;
}
window.addEventListener('resize', resize);
resize();

// Fullscreen
function goFull() {
    const el = document.documentElement;
    if (el.requestFullscreen) el.requestFullscreen();
    else if (el.webkitRequestFullscreen) el.webkitRequestFullscreen();
}
canvas.addEventListener('click', () => { goFull(); hint.style.display = 'none'; });
document.addEventListener('fullscreenchange', () => {
    if (!document.fullscreenElement) hint.style.display = '';
});

// ══════════════════════════════════════════════════════════════════
// Constants
// ══════════════════════════════════════════════════════════════════
const FONT = '"SimHei","Microsoft YaHei","PingFang SC","Noto Sans SC","STHeiti",sans-serif';
const MONO = '"Consolas","Courier New",monospace';

const TEXTS = ["3","2","1","Hi 我的宝贝","七夕节快乐","很想告诉你","你是独一无二的","爱你胜过一切","I LOVE YOU"];
const HEART_TRIGGER = 6;
const NUM_PARTICLES = 1500;
const PHASE_HOLD_S = 2.5;
const TRANSITION_S = 1.35;
const SCATTER_S = 2.0;
const HEART_SCALE = H * 0.008;
const HEART_N_CONTOUR = 600;
const HEART_N_INNER = 250;

// ══════════════════════════════════════════════════════════════════
// Helpers
// ══════════════════════════════════════════════════════════════════
const _off = document.createElement('canvas');
const _octx = _off.getContext('2d');
const _targetCache = {};

function getTextTargets(text, fontSize, num, cx, cy) {
    const key = text + '|' + fontSize + '|' + cx.toFixed(0) + '|' + cy.toFixed(0);
    if (_targetCache[key]) return _targetCache[key];

    _octx.font = `bold ${fontSize}px ${FONT}`;
    const m = _octx.measureText(text);
    const tw = Math.ceil(m.width) + 8;
    const th = Math.ceil(fontSize * 1.35) + 8;
    _off.width = tw; _off.height = th;
    _octx.font = `bold ${fontSize}px ${FONT}`;
    _octx.fillStyle = '#fff';
    _octx.textBaseline = 'top';
    _octx.textAlign = 'left';
    _octx.fillText(text, 4, 4);

    const data = _octx.getImageData(0, 0, tw, th).data;
    const px = [];
    for (let y = 0; y < th; y++) {
        for (let x = 0; x < tw; x++) {
            if (data[(y * tw + x) * 4 + 3] > 100) {
                px.push({ x: x - tw / 2 + cx, y: y - th / 2 + cy + fontSize * 0.15 });
            }
        }
    }
    if (!px.length) { const r = []; for(let i=0;i<num;i++) r.push({x:cx,y:cy}); return r; }

    // Shuffle
    for (let i = px.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [px[i], px[j]] = [px[j], px[i]];
    }
    let result = px.slice(0, num);
    while (result.length < num) result = result.concat(px.slice(0, num - result.length));
    result = result.map(p => ({
        x: p.x + (Math.random() - 0.5) * 0.6,
        y: p.y + (Math.random() - 0.5) * 0.6,
    }));
    _targetCache[key] = result;
    return result;
}

function pickFontSize(text) {
    const L = text.length;
    if (L <= 1) return Math.round(320 * BASE_SCALE);
    if (L <= 3) return Math.round(240 * BASE_SCALE);
    if (L <= 5) return Math.round(180 * BASE_SCALE);
    if (L <= 8) return Math.round(140 * BASE_SCALE);
    return Math.round(100 * BASE_SCALE);
}

function heartXY(t, scale, cx, cy) {
    const s = Math.sin(t);
    const x = 16 * s * s * s;
    const y = 13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t);
    return [cx + x * scale, cy - y * scale];
}

// ══════════════════════════════════════════════════════════════════
// Particle
// ══════════════════════════════════════════════════════════════════
class Particle {
    constructor(x, y) {
        this.x = this.tx = this.sx = x;
        this.y = this.ty = this.sy = y;
        const r = (Math.random() * 30) | 0;
        const g = (210 + Math.random() * 45) | 0;
        const b = (70 + Math.random() * 60) | 0;
        this.color = `rgb(${r},${g},${b})`;
        this.coreColor = `rgb(${Math.min(255,r+80)},${Math.min(255,g+80)},${Math.min(255,b+80)})`;
        this.size = 2 + Math.random() * 3;
        this.alpha = 1;
        this.progress = 1;
    }
    flyTo(tx, ty) {
        this.sx = this.x; this.sy = this.y;
        this.tx = tx; this.ty = ty;
        this.progress = 0;
    }
    step(amount) {
        if (this.progress >= 1) return;
        this.progress = Math.min(1, this.progress + amount);
        const t = this.progress;
        const e = 1 - (1 - t) ** 3;
        this.x = this.sx + (this.tx - this.sx) * e;
        this.y = this.sy + (this.ty - this.sy) * e;
    }
    draw() {
        if (this.alpha <= 0 || this.size < 0.3) return;
        const sz = Math.max(1, this.size | 0);
        ctx.fillStyle = this.color;
        ctx.beginPath();
        ctx.arc(this.x, this.y, sz, 0, Math.PI * 2);
        ctx.fill();
        if (sz >= 3) {
            ctx.fillStyle = this.coreColor;
            ctx.beginPath();
            ctx.arc(this.x, this.y, sz >> 1, 0, Math.PI * 2);
            ctx.fill();
        }
    }
}

// ══════════════════════════════════════════════════════════════════
// Matrix Rain
// ══════════════════════════════════════════════════════════════════
class MatrixRain {
    constructor() {
        this.cols = Math.max(80, (W / 11) | 0);
        this.drops = [];
        this.time = 0;
        for (let i = 0; i < this.cols * 3; i++) this.drops.push(this._fresh());
    }
    _fresh() {
        return {
            x: Math.random() * W,
            y: Math.random() * -H * 1.2,
            speed: 50 + Math.random() * 110,
            length: (5 + Math.random() * 11) | 0,
            phase: Math.random() * Math.PI * 2,
            oscSpeed: 1.8 + Math.random() * 2.7,
            chars: Array.from({ length: 16 }, () => 'ILOVEYOU'[(Math.random() * 8) | 0]),
        };
    }
    update(dt) {
        this.time += dt;
        for (const d of this.drops) {
            d.y += d.speed * dt;
            if (d.y - d.length * 18 > H) Object.assign(d, this._fresh());
        }
    }
    draw() {
        const t = this.time;
        ctx.font = `bold 19px ${MONO}`;
        ctx.textBaseline = 'top';
        ctx.textAlign = 'left';
        for (const d of this.drops) {
            const L = d.length;
            for (let i = 0; i < L; i++) {
                const yp = d.y - i * 18;
                if (yp < -20 || yp > H + 20) continue;
                let baseA, r, g, b;
                if (i === 0) { r = 255; g = 255; b = 255; baseA = 1; }
                else if (i === 1) { r = 200; g = 200; b = 200; baseA = 0.78; }
                else {
                    const fade = i / L;
                    const v = (180 * (1 - fade)) | 0;
                    r = g = b = Math.max(20, v);
                    baseA = Math.max(0.08, 0.7 * (1 - fade));
                }
                const osc = 0.5 + 0.5 * Math.sin(t * d.oscSpeed + d.phase + i * 0.7);
                const a = baseA * (0.35 + 0.65 * osc);
                if (a < 0.03) continue;
                ctx.globalAlpha = a;
                ctx.fillStyle = `rgb(${r},${g},${b})`;
                ctx.fillText(d.chars[i], d.x, yp);
            }
        }
        ctx.globalAlpha = 1;
    }
}

// ══════════════════════════════════════════════════════════════════
// Heart System — fountain spray outward
// ══════════════════════════════════════════════════════════════════
class HeartSystem {
    constructor(scale) {
        this.scale = scale;
        this.active = false;
        this.alpha = 0;
        this.phaseAcc = 0;

        this.contour = [];
        for (let i = 0; i < HEART_N_CONTOUR; i++) {
            const bt = Math.random() * Math.PI * 2;
            const ls = scale * (0.85 + Math.random() * 0.3);
            const [px, py] = heartXY(bt, ls, CX, CY);
            this.contour.push({
                x: px, y: py, cx: px, cy: py, baseT: bt,
                scale: ls, sprayPhase: Math.random() * Math.PI * 2,
                spraySpeed: 2 + Math.random() * 2.5, sprayDist: 0,
                size: 2 + Math.random() * 2.5,
            });
        }

        this.inner = [];
        for (let i = 0; i < HEART_N_INNER; i++) {
            const bt = Math.random() * Math.PI * 2;
            const s = 0.05 + Math.random() * 0.2;
            const [px, py] = heartXY(bt, scale * s, CX, CY);
            this.inner.push({
                x: px, y: py, t: bt, s,
                speed: 0.25 + Math.random() * 0.45,
                size: 1 + Math.random() * 2,
                phase: Math.random() * Math.PI * 2,
            });
        }
    }
    activate() { this.active = true; this.alpha = 0; }

    update(dt) {
        if (!this.active) return;
        if (this.alpha < 1) this.alpha = Math.min(1, this.alpha + dt * 1.1);
        this.phaseAcc += dt;
        const p = this.phaseAcc;

        for (const c of this.contour) {
            c.sprayDist = Math.abs(Math.sin(p * c.spraySpeed + c.sprayPhase)) * 18;
            const bt = (c.baseT + p * 0.2) % (Math.PI * 2);
            const [bx, by] = heartXY(bt, c.scale, CX, CY);
            const angle = Math.atan2(by - CY, bx - CX);
            c.x += ((bx + Math.cos(angle) * c.sprayDist) - c.x) * 0.15;
            c.y += ((by + Math.sin(angle) * c.sprayDist) - c.y) * 0.15;
        }

        for (const ip of this.inner) {
            ip.s += ip.speed * dt * 0.18;
            if (ip.s >= 1.05) {
                ip.t = Math.random() * Math.PI * 2;
                ip.s = 0.03 + Math.random() * 0.15;
                ip.speed = 0.25 + Math.random() * 0.45;
            }
            const drift = ip.t + Math.sin(p * 1.2 + ip.phase) * 0.12;
            const [tx, ty] = heartXY(drift, this.scale * ip.s, CX, CY);
            ip.x += (tx - ip.x) * 0.10;
            ip.y += (ty - ip.y) * 0.10;
        }
    }

    draw() {
        if (!this.active) return;
        for (const ip of this.inner) {
            const sz = Math.max(1, ip.size | 0);
            ctx.fillStyle = 'rgb(255,80,110)';
            ctx.beginPath(); ctx.arc(ip.x, ip.y, sz, 0, Math.PI * 2); ctx.fill();
        }
        for (const c of this.contour) {
            const sz = Math.max(1, c.size | 0);
            const bright = 0.7 + 0.3 * (c.sprayDist / 18);
            const r = Math.min(255, (255 * bright + 60 * (1 - bright)) | 0);
            const g = (23 * bright) | 0;
            const b = (68 * bright) | 0;
            ctx.fillStyle = `rgb(${r},${g},${b})`;
            ctx.beginPath(); ctx.arc(c.x, c.y, sz, 0, Math.PI * 2); ctx.fill();
            if (sz >= 3) {
                ctx.strokeStyle = 'rgb(255,60,90)';
                ctx.lineWidth = 1;
                ctx.beginPath(); ctx.arc(c.x, c.y, sz + 1, 0, Math.PI * 2); ctx.stroke();
            }
        }
    }
}

// ══════════════════════════════════════════════════════════════════
// Main Animation
// ══════════════════════════════════════════════════════════════════
const rain = new MatrixRain();
const heart = new HeartSystem(HEART_SCALE);

const particles = [];
for (let i = 0; i < NUM_PARTICLES; i++) {
    const theta = Math.random() * Math.PI * 2;
    const phi = Math.acos(2 * Math.random() - 1);
    const r = 60 * Math.random() ** (1 / 3);
    particles.push(new Particle(
        CX + r * Math.sin(phi) * Math.cos(theta),
        CY + r * Math.sin(phi) * Math.sin(theta),
    ));
}

let phase = -1;
let phaseElapsed = 0;
let transitioning = false;
let transProgress = 0;
let transDur = TRANSITION_S;
let done = false;
let heartTextAlpha = 0;

function startTransition(idx) {
    const text = TEXTS[idx];
    const fs = pickFontSize(text);
    const targets = getTextTargets(text, fs, NUM_PARTICLES, CX, CY);
    for (let i = 0; i < particles.length; i++) {
        particles[i].flyTo(targets[i].x, targets[i].y);
    }
}

function startScatter() {
    for (const p of particles) {
        const angle = Math.atan2(p.y - CY, p.x - CX);
        const dist = 350 + Math.random() * 600;
        p.flyTo(p.x + Math.cos(angle) * dist, p.y + Math.sin(angle) * dist);
    }
}

function update(dt) {
    dt = Math.min(dt, 0.05);
    rain.update(dt);
    heart.update(dt);
    if (done) return;

    if (!transitioning) {
        phaseElapsed += dt;
        const hold = phase >= 0 ? PHASE_HOLD_S : 1.5;
        if (phaseElapsed >= hold) {
            transitioning = true;
            transProgress = 0;
            phaseElapsed = 0;
            phase++;

            if (phase < TEXTS.length) {
                startTransition(phase);
                transDur = TRANSITION_S;
                if (phase === HEART_TRIGGER) {
                    heart.activate();
                    heartTextAlpha = 0.01;
                }
            } else if (phase === TEXTS.length) {
                startScatter();
                transDur = SCATTER_S;
            } else {
                done = true;
            }
        }
        return;
    }

    const step = dt / transDur;
    transProgress = Math.min(1, transProgress + step);
    for (const p of particles) p.step(step);

    if (phase === TEXTS.length) {
        for (const p of particles) {
            p.alpha = Math.max(0, 1 - transProgress);
            p.size = Math.max(0.3, p.size - dt * 1.5);
        }
    }

    if (transProgress >= 1) {
        transitioning = false;
        if (phase === TEXTS.length) phase++;
    }

    if (heartTextAlpha > 0 && heartTextAlpha < 1) {
        heartTextAlpha = Math.min(1, heartTextAlpha + dt * 0.47);
    }
}

function drawHeartText() {
    if (heartTextAlpha <= 0) return;
    const a = heartTextAlpha;
    const fontSize = Math.round(28 * BASE_SCALE);
    ctx.font = `bold ${fontSize}px ${FONT}`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    const gap = 4;
    const lines = ['心之所向', '爱之所往'];

    // Shadow
    ctx.fillStyle = `rgba(0,0,0,${Math.min(a, 0.7).toFixed(2)})`;
    for (const [dx, dy] of [[-2,0],[2,0],[0,-2],[0,2]]) {
        ctx.fillText(lines[0], CX + dx, CY - gap + dy);
        ctx.fillText(lines[1], CX + dx, CY + gap + dy);
    }
    // Foreground
    ctx.fillStyle = `rgba(255,183,197,${a.toFixed(2)})`;
    ctx.fillText(lines[0], CX, CY - gap);
    ctx.fillText(lines[1], CX, CY + gap);
}

function draw() {
    ctx.globalAlpha = 1;
    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, W, H);

    rain.draw();

    // Heart + text under foreground particles
    heart.draw();
    drawHeartText();

    for (const p of particles) p.draw();
}

let last = performance.now();

function loop(now) {
    const dt = (now - last) / 1000;
    last = now;
    update(dt);
    draw();
    requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
</html>
